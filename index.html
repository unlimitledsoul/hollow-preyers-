<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Glórias do Clube</title>
  <style>
    :root {
      --primary: #111827;
      --accent: #eab308;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      color: var(--accent);
    }

    .counter {
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0.9;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .trophy-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .card h3 {
      margin: 10px 0 5px 0;
      color: var(--primary);
    }

    .count {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
      margin: 10px 0;
    }

    .years {
      font-size: 0.85rem;
      color: #6b7280;
      max-height: 0;
      opacity: 0;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .card:hover .years {
      max-height: 100px;
      opacity: 1;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sala de Troféus</h1>
    <div class="counter">Total de Conquistas: <span id="total-count">0</span></div>
  </header>

  <div class="filters">
    <button class="filter-btn active" onclick="filterTitles('all')">Todos</button>
    <button class="filter-btn" onclick="filterTitles('nacional')">Nacionais</button>
    <button class="filter-btn" onclick="filterTitles('internacional')">Internacionais</button>
  </div>

  <div class="grid">
    <div class="card" data-category="internacional" data-amount="3">
      <div class="trophy-icon">🏆</div>
      <h3>Mundial de Clubes</h3>
      <div class="count">3</div>
      <div class="years">Anos: 1992, 1993, 2005</div>
    </div>

    <div class="card" data-category="internacional" data-amount="3">
      <div class="trophy-icon">🌎</div>
      <h3>Copa Libertadores</h3>
      <div class="count">3</div>
      <div class="years">Anos: 1992, 1993, 2005</div>
    </div>

    <div class="card" data-category="nacional" data-amount="6">
      <div class="trophy-icon">🥇</div>
      <h3>Campeonato Brasileiro</h3>
      <div class="count">6</div>
      <div class="years">Anos: 1977, 1986, 1991, 2006, 2007, 2008</div>
    </div>

    <div class="card" data-category="nacional" data-amount="1">
      <div class="trophy-icon">👑</div>
      <h3>Copa do Brasil</h3>
      <div class="count">1</div>
      <div class="years">Ano: 2023</div>
    </div>
  </div>

  <script>
    function filterTitles(category) {
      const cards = document.querySelectorAll('.card');
      const buttons = document.querySelectorAll('.filter-btn');

      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      cards.forEach(card => {
        if (category === 'all' || card.dataset.category === category) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
      updateTotal();
    }

    function updateTotal() {
      const visibleCards = document.querySelectorAll('.card[style*="display: block"], .card:not([style*="display"])');
      let total = 0;
      visibleCards.forEach(card => {
        total += parseInt(card.dataset.amount);
      });
      document.getElementById('total-count').textContent = total;
    }

    // Inicializa o contador ao carregar
    updateTotal();
  </script>

</body>
</html>
